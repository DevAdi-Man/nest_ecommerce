services:
  postgres:
    image: postgres:17
    container_name: ecommerce_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

  adminer:
    image: adminer
    container_name: ecommerce_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  minio:
    image: minio/minio
    container_name: ecommerce_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: ecommerce_mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  architecture-docs:
    image: nginx:alpine
    container_name: ecommerce_architecture_docs
    restart: always
    ports:
      - "8082:80"
    volumes:
      - ./db-schema.html:/usr/share/nginx/html/index.html:ro

  schemaspy:
    image: schemaspy/schemaspy:latest
    container_name: ecommerce_schemaspy
    user: "root"
    command: -t pgsql11 -host postgres -port 5432 -db ecommerce -u postgres -p password -s public
    volumes:
      - schemaspy_data:/output
    depends_on:
      - postgres

  schemaspy-docs:
    image: nginx:alpine
    container_name: ecommerce_schemaspy_docs
    restart: always
    ports:
      - "8083:80"
    volumes:
      - schemaspy_data:/usr/share/nginx/html:ro
    depends_on:
      - schemaspy

volumes:
  schemaspy_data:
  postgres_data:
  redis_data:
  minio_data:
